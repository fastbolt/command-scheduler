name: "Psalm PHP checks"

on:
    pull_request:
        paths:
            - "**.php"
            - "composer.json"
            - "composer.lock"
            - "psalm.xml"
            - ".psalm/baseline.xml"
            - ".github/workflows/psalm.yaml"
    push:
        paths:
            - "**.php"
            - "composer.json"
            - "composer.lock"
            - "psalm.xml"
            - ".psalm/baseline.xml"
            - ".github/workflows/psalm.yaml"

jobs:
    psalm:
        name: Psalm
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  tools: composer:v2
                  coverage: none

            - name: Install dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Check Psalm version
              run: vendor/bin/psalm --version

            - name: Run Psalm
              run: vendor/bin/psalm --no-progress --output-format=github